# The store listing (https://daybrite.dev/docs/reference/store): the text both stores show, in
# each locale, and the submission details. `day store stage` turns it into the layouts App Store
# Connect and Google Play expect, under build/day/store/<target>/, ready for fastlane.
# The bundle id comes from Day.toml [app] id.

[storefront.submission-info]
copyright = "2026 App Fair Project"
contact-email = "support@appfair.org"
review-notes = """
App Fair browses F-Droid-compatible catalogs of free and open-source apps and installs them through
Android's own package installer, after verifying each download against the checksum the catalog
publishes. Install permission is requested at the first install, and the system's own confirmation
dialog is what completes it.

Set APP_FAIR_MOCK=1 to run against the bundled offline catalog if outbound network access is
unavailable during review.
"""

[storefront.ios-uikit.apple-app-store.submission-info]
apple-category = "UTILITIES"

[storefront.metadata]
name = "App Fair"
subtitle = "Open source, installed simply"
short = "A free and open source app store: browse trusted catalogs and install directly."
description = """
App Fair is an open, privacy-respecting app store. Browse free and open-source apps, read their details, and install or update them straight from the repositories you trust — no account, no tracking, no ads.

FEATURES

• Browse F-Droid-compatible catalogs, with search, categories and sorting
• Read what an app actually asks for — permissions, anti-features and its signing key — before installing
• Install and update through Android's own installer, after the download is verified against the checksum the catalog published
• Add, enable, disable and remove catalogs: the sources are yours to choose
• Filter out anti-features you do not want to see

PRIVACY

App Fair has no account and collects nothing about you. It talks to the catalogs you have enabled and to nothing else.

HOW INSTALLS WORK

App Fair does not install anything silently. It downloads the package, checks it against the catalog's published checksum, and hands it to the system installer — the same confirmation you would see installing any app from any source.

Open source: github.com/marcprux/App-Fair
"""
keywords = ["app store", "f-droid", "open source", "foss", "catalog", "repository", "sideload", "updates", "privacy"]
release-notes = "First public release of App Fair — browse, install, and update open-source apps from F-Droid-compatible catalogs."
promo = "An app store with no account, no tracking and no ads — and catalogs you choose yourself."
marketing-url = "https://appfair.org"
support-url = "https://github.com/marcprux/App-Fair/issues"
privacy-url = "https://github.com/marcprux/App-Fair/blob/main/PRIVACY.md"

[storefront.metadata.fr]
subtitle = "Le libre, simplement installé"
short = "Une logithèque libre et open source : parcourez des catalogues de confiance."
description = """
App Fair est une logithèque ouverte et respectueuse de la vie privée. Parcourez des applications libres et open source, consultez leurs détails, puis installez-les ou mettez-les à jour directement depuis les dépôts auxquels vous faites confiance — sans compte, sans pistage, sans publicité.

FONCTIONNALITÉS

• Parcourez des catalogues compatibles F-Droid, avec recherche, catégories et tri
• Voyez ce qu'une application demande réellement — permissions, anti-fonctionnalités et clé de signature — avant de l'installer
• Installez et mettez à jour via l'installateur d'Android, après vérification du téléchargement avec la somme de contrôle publiée par le catalogue
• Ajoutez, activez, désactivez et supprimez des catalogues : les sources vous appartiennent
• Filtrez les anti-fonctionnalités dont vous ne voulez pas

VIE PRIVÉE

App Fair n'a pas de compte et ne collecte rien vous concernant. L'application communique avec les catalogues que vous avez activés, et avec rien d'autre.

COMMENT SE PASSE UNE INSTALLATION

App Fair n'installe rien en silence. L'application télécharge le paquet, le vérifie avec la somme de contrôle publiée par le catalogue, puis le confie à l'installateur du système — la même confirmation que pour n'importe quelle application, quelle qu'en soit la source.

Code source : github.com/marcprux/App-Fair
"""
keywords = ["logithèque", "f-droid", "open source", "libre", "catalogue", "dépôt", "mises à jour", "vie privée"]
release-notes = "Première version publique d'App Fair — parcourez, installez et mettez à jour des applications open source depuis des catalogues compatibles F-Droid."
promo = "Une logithèque sans compte, sans pistage et sans publicité — avec les catalogues que vous choisissez."
