  <!-- The App Fair mark: a shopping bag holding a 2x2 grid of apps, over a blue sky. `day prepare`
       renders every platform's icon from this file; the two layers feed Android's adaptive icon
       (https://daybrite.dev/docs/how-to/guide-icons). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C86FF"/>
      <stop offset="1" stop-color="#2E63E0"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B2A66" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect id="day:background" x="0" y="0" width="1024" height="1024" fill="url(#sky)"/>
  <g id="day:foreground">
    <path d="M382 396 C382 306 642 306 642 396" fill="none" stroke="#FF6B5E" stroke-width="38" stroke-linecap="round"/>
    <rect x="294" y="384" width="436" height="384" rx="58" fill="#FFFFFF" filter="url(#sh)"/>
    <rect x="393" y="457" width="104" height="104" rx="26" fill="#2F6FDE"/>
    <rect x="527" y="457" width="104" height="104" rx="26" fill="#22B07A"/>
    <rect x="393" y="591" width="104" height="104" rx="26" fill="#FF8A3D"/>
    <rect x="527" y="591" width="104" height="104" rx="26" fill="#F0C23A"/>
  </g>
</svg>
