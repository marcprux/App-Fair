name: ci

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

# The repository's own jobs run this checkout's code with a read-only token. The write grants
# sit on the job that calls the shared workflow, whose release and Pages jobs alone use them;
# its build legs, which run this code too, narrow their token to read-only themselves.
permissions:
  contents: read

jobs:
  app:
    uses: daybrite/actions/.github/workflows/dayapp.yml@main
    permissions:
      contents: write # release-asset upload on tag builds
    secrets: inherit
    with:
      targets: android-material
      day-version: main
      # The walkthrough runs against the bundled mock catalog (APP_FAIR_MOCK=1) so screenshots are
      # deterministic and offline — no 50 MB F-Droid index download in CI.
      scripts: dayscript/ci.yaml
      launch-env: APP_FAIR_MOCK=1
      locales: en fr
